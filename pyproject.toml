[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "purivox"
dynamic = ["version"]
description = "Reference-guided vocal isolation for stage and live recordings, with a PySide6 Fluent UI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Purivox contributors" }]
dependencies = [
  "numpy>=2.0,<3",
  "PySide6>=6.8,<7",
  "PySide6-Fluent-Widgets>=1.11.3,<2",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<1",
  "soxr>=0.5,<2",
  "yt-dlp>=2025.1,<2027",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-qt>=4.4,<5",
  "ruff>=0.12,<1",
]
deploy = ["pyinstaller==6.22.3"]

[project.scripts]
purivox = "entrypoints.cli:main"

[project.urls]
Homepage = "https://purivox.wwchun.top/"
Documentation = "https://github.com/ChouChiu/Purivox/tree/main/docs"
Issues = "https://github.com/ChouChiu/Purivox/issues"
Repository = "https://github.com/ChouChiu/Purivox"

[tool.hatch.version]
path = "src/app/version.py"

[tool.hatch.build.targets.wheel]
packages = [
  "src/app",
  "src/entrypoints",
  "src/features",
  "src/resources",
  "src/shared",
  "src/web",
]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "deployment",
  "docs",
  "README.md",
  "README_EN.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
testpaths = ["tests"]
markers = ["slow: resource-intensive acceptance tests"]
