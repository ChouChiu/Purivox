name: 功能建议 / Feature request
description: 提出一个新功能或一处改进 / Suggest a feature or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        中文或英文都可以，写你顺手的那个。
        Chinese or English — whichever you write faster.

  - type: checkboxes
    id: checks
    attributes:
      label: 提交之前 / Before you file
      options:
        - label: 我搜索过既有 issue，没有找到相同的建议 / I searched the existing issues and found no duplicate
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / The problem
      description: |
        先写问题，再写做法。只描述做法的建议很难判断值不值得做，也容易错过更简单的解法。
        Describe the problem before the solution: a proposal without one is hard to weigh, and often
        hides a simpler answer.
      placeholder: |
        整场录音里我通常只要其中三四首，但每次都要把整条时间线看一遍才能确认没漏掉。
        I usually want three or four songs out of a stage recording, but I have to read the whole
        timeline every time to be sure I did not miss one.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法 / What you have in mind
      description: 越具体越好：放在哪个页面、什么时候触发、结果长什么样。/ The more concrete the better — which page, what triggers it, what the result looks like.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪一部分 / Which part
      description: 不确定就留空。/ Leave it empty if you are not sure.
      multiple: true
      options:
        - 单曲人声提取 / Single vocal isolation
        - 整场录音 / Full stage
        - AI 分离 / AI separation
        - 试听与音频信息 / Preview and audio statistics
        - 界面、主题与语言 / Interface, theme and language
        - 命令行 / Command line
        - 浏览器版 / Browser build
        - 安装、打包与更新 / Install, packaging and updates

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过或考虑过的其他做法 / Alternatives you tried or considered
      description: 包括现在你是怎么绕过去的。/ Including how you work around it today.

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Anything else
      description: |
        截图、参考实现、相关论文都可以。有两件事先说明，免得白写：应用不会自我更新，更新只做到打开
        Release 页面；浏览器版没有 AI 分离，因为它依赖的 ONNX 运行时没有 WebAssembly 构建。

        Screenshots, prior art, papers — all welcome. Two things to save you the trouble: the app never
        updates itself, an update only opens the release page; and the browser build has no AI
        separation, because the ONNX runtime it needs has no WebAssembly build.
