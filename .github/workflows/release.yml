name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Passed down to common.yml; its web job checks the ref itself and deploys
  # nothing from a tag.
  pages: write
  id-token: write

concurrency:
  # A tag build is never cancelled: it is the only run that can publish.
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    uses: ./.github/workflows/common.yml

  publish:
    name: Publish release
    # This publishes what this very run built: common.yml uploaded the
    # onefiles and the distributions into this run, so the release is assembled
    # from them rather than from a second, differently-built copy.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download Python distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions-${{ github.run_id }}
          path: release

      - name: Download Linux packages
        uses: actions/download-artifact@v7
        with:
          name: linux-packages-${{ github.run_id }}
          path: release

      - name: Download Windows onefile
        uses: actions/download-artifact@v7
        with:
          name: windows-onefile-${{ github.run_id }}
          path: release

      - name: Download macOS bundle
        uses: actions/download-artifact@v7
        with:
          name: macos-bundle-${{ github.run_id }}
          path: release

      - name: Collect checksums
        id: checksums
        run: |
          # Each build job checksummed its own output under dist/. The release
          # page holds one flat list of assets, so one flat SHA256SUMS replaces
          # the per-job files rather than shipping paths that no longer resolve.
          cd release
          rm -f SHA256SUMS-python SHA256SUMS-linux SHA256SUMS-windows SHA256SUMS-macos
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Assemble release notes
        id: notes
        run: |
          # CHANGELOG.md keeps one section per tag, and that section is what the
          # in-app update dialog shows. A tag without one falls back to the
          # generated notes rather than publishing an empty release.
          awk -v tag="${GITHUB_REF_NAME}" '
            /^## / { if (found) exit; found = ($2 == tag); next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ -s notes.md ]]; then
            echo "source=CHANGELOG.md" >> "$GITHUB_OUTPUT"
          else
            echo "source=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          if [[ -s notes.md ]]; then
            notes=(--notes-file notes.md)
          fi
          # A tag carrying a suffix is a pre-release, and the update check asks
          # for the latest release, which GitHub answers without those.
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # A re-run of a tag build replaces the assets it already uploaded
            # instead of failing on the release that is standing there.
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --title "${GITHUB_REF_NAME}" \
              --verify-tag \
              "${notes[@]}" \
              "${prerelease[@]}"
          fi
          url="$(gh release view "${GITHUB_REF_NAME}" --json url --jq .url)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      - name: Write summary
        if: ${{ always() }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          ## Release summary

          | Item | Result |
          |---|---|
          | Job | `${{ job.status }}` |
          | Tag | `${{ github.ref_name }}` |
          | Notes | `${{ steps.notes.outputs.source }}` |
          | Release | ${{ steps.publish.outputs.url || 'Not published' }} |
          MARKDOWN
